<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#111315;--gold:#ffe500;--muted:#69717c;--line:#e4e8ed;--green:#19a974;--red:#d6453d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f6f8;color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line)}
.bar b{letter-spacing:.08em;font-size:17px}
.muted{color:var(--muted);font-size:14px}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px;text-align:center}
.wide{max-width:960px}
.num{font:500 96px 'DM Mono',monospace;line-height:1}
.btn{width:100%;border:0;border-radius:20px;font:800 22px 'Plus Jakarta Sans';cursor:pointer;padding:34px 20px;background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.5}
.btn2{width:100%;border:1px solid #dfe3e8;background:#fff;border-radius:14px;padding:16px;font:800 15px 'Plus Jakarta Sans';cursor:pointer;margin-top:12px}
.btn2.danger{color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:16px 0}
input{width:100%;font:700 22px 'DM Mono',monospace;text-align:center;padding:14px;border:1px solid #dfe3e8;border-radius:14px;margin:12px 0}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{font:500 18px 'DM Mono',monospace;padding:6px 12px;border-radius:999px;background:#eef1f4}
.menu a{display:block;padding:20px;margin:12px 0;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:800}
.tv{background:var(--ink);color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.tv .num{font-size:min(34vw,320px);color:var(--gold)}
.tv .flash{animation:flash .8s ease 3}
@keyframes flash{50%{opacity:.2}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{display:block;font:500 34px 'DM Mono',monospace}
.hours{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:12px}
.hours i{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px}
.hl{display:flex;justify-content:space-between;font:11px 'DM Mono',monospace;color:var(--muted);margin-top:4px}
select{font:700 14px 'Plus Jakarta Sans';padding:8px;border-radius:10px;border:1px solid #dfe3e8}
@media (prefers-reduced-motion:reduce){.tv .flash{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var ROLE = <?!= JSON.stringify(role) ?>;
var BASE = <?!= JSON.stringify(baseUrl) ?>;
var root = document.getElementById('root');
var PIN = '';
var label = function (n) { return 'A' + ('00' + n).slice(-3); };
function run(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, no) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { no(e); });
    r[fn].apply(r, args);
  });
}
function msg(e) { return String((e && e.message) || e).replace(/^Error:\s*/, ''); }
function savePin(p) { try { sessionStorage.setItem('rk_pin', p); } catch (e) {} }
function loadPin() { try { return sessionStorage.getItem('rk_pin') || ''; } catch (e) { return ''; } }

/* ---------- เมนู ---------- */
function menu() {
  root.innerHTML = '<main class="menu"><h2>RUAMKIT</h2><a href="' + BASE + '?role=caller">🔒 เจ้าหน้าที่เรียกคิว</a>' +
    '<a href="' + BASE + '?role=display">จอแสดงผล</a><a href="' + BASE + '?role=dashboard">🔒 แดชบอร์ด</a></main>';
}

/* ---------- ด่าน PIN ---------- */
function gate(title, onOk) {
  root.innerHTML = '<main><div class="card"><h3>' + title + '</h3><div class="muted">ใส่รหัส PIN เจ้าหน้าที่</div>' +
    '<input id="pin" type="password" inputmode="numeric" autocomplete="off"><button class="btn2" id="go">เข้าสู่ระบบ</button>' +
    '<div class="err" id="err"></div></div></main>';
  var go = function () {
    var p = document.getElementById('pin').value;
    run('checkStaffPin', p).then(function (ok) {
      if (!ok) { document.getElementById('err').textContent = 'PIN ไม่ถูกต้อง ลองอีกครั้ง'; return; }
      PIN = p; savePin(p); onOk();
    }).catch(function (e) { document.getElementById('err').textContent = msg(e); });
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pin').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}
function start(title, onOk) {
  var p = loadPin();
  if (!p) return gate(title, onOk);
  run('checkStaffPin', p).then(function (ok) { if (ok) { PIN = p; onOk(); } else gate(title, onOk); })
    .catch(function () { gate(title, onOk); });
}

/* ---------- เจ้าหน้าที่ ---------- */
function caller() {
  root.innerHTML = '<div class="bar"><b>RUAMKIT</b><span class="muted">เคาน์เตอร์เจ้าหน้าที่</span></div><main>' +
    '<div class="muted">กำลังเรียก</div><div class="num" id="cur">-</div><div class="muted" id="wait" style="margin:10px 0 20px"></div>' +
    '<button class="btn" id="next">เรียกคิวถัดไป</button><button class="btn2" id="recall">เรียกซ้ำ</button>' +
    '<button class="btn2 danger" id="reset">ล้างคิวทั้งหมด</button><div class="err" id="err"></div>' +
    '<div class="chips" id="hist"></div></main>';
  var err = document.getElementById('err');
  function refresh() {
    run('getState').then(function (s) {
      document.getElementById('cur').textContent = s.currentCalling ? label(s.currentCalling) : '-';
      document.getElementById('wait').textContent = 'รอคิวอยู่ ' + s.waiting.length + ' คน';
      document.getElementById('hist').innerHTML = s.history.map(function (n) { return '<span class="chip">' + label(n) + '</span>'; }).join('');
    }).catch(function () {});
  }
  function act(btnId, fn, after) {
    var b = document.getElementById(btnId);
    b.onclick = function () {
      err.textContent = ''; b.disabled = true;
      run(fn, PIN).then(function (r) { if (after) after(r); refresh(); })
        .catch(function (e) { err.textContent = msg(e); if (/PIN/.test(msg(e))) { savePin(''); } })
        .then(function () { b.disabled = false; });
    };
  }
  act('next', 'callNext', function (r) { if (r === null) err.textContent = 'ไม่มีคิวที่รออยู่'; });
  act('recall', 'recallCurrent');
  var rb = document.getElementById('reset');
  rb.onclick = function () {
    if (!confirm('ล้างคิวทั้งหมดและเริ่มนับ A001 ใหม่ใช่หรือไม่? ข้อมูลวันนี้จะถูกเก็บลงชีต History')) return;
    run('resetAll', PIN).then(refresh).catch(function (e) { err.textContent = msg(e); });
  };
  refresh(); setInterval(refresh, 2500);
}

/* ---------- จอแสดงผล ---------- */
function display() {
  root.innerHTML = '<div class="tv"><div style="font-size:min(5vw,40px)">เชิญหมายเลข</div><div class="num" id="cur">-</div>' +
    '<div style="font-size:min(4vw,28px);margin-top:12px" id="wait"></div>' +
    '<div class="chips" id="hist" style="margin-top:24px"></div><div class="muted" id="snd" style="margin-top:24px;cursor:pointer">แตะหน้าจอหนึ่งครั้งเพื่อเปิดเสียงเรียก</div></div>';
  var audioOn = false, lastNum = null, lastRecall = null, ctx = null;
  document.body.addEventListener('click', function () {
    if (audioOn) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); audioOn = true; document.getElementById('snd').textContent = '🔊 เปิดเสียงแล้ว'; } catch (e) {}
  });
  function ding() {
    if (!ctx) return;
    for (var i = 0; i < 2; i++) {
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * .5;
      o.frequency.value = i ? 880 : 1100; g.gain.setValueAtTime(.4, t); g.gain.exponentialRampToValueAtTime(.01, t + .45);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .5);
    }
  }
  function refresh() {
    run('getState').then(function (s) {
      var el = document.getElementById('cur');
      el.textContent = s.currentCalling ? label(s.currentCalling) : '-';
      var changed = lastNum !== null && s.currentCalling && s.currentCalling !== lastNum;
      var recalled = lastRecall !== null && s.recallToken > lastRecall;
      if (changed || recalled) { ding(); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
      lastNum = s.currentCalling; lastRecall = s.recallToken;
      document.getElementById('wait').textContent = 'รอคิวอยู่ ' + s.waiting.length + ' คน';
      document.getElementById('hist').innerHTML = s.history.slice(1).map(function (n) { return '<span class="chip" style="background:#262a2e">' + label(n) + '</span>'; }).join('');
    }).catch(function () {});
  }
  refresh(); setInterval(refresh, 2500);
}

/* ---------- แดชบอร์ด ---------- */
function dashboard() {
  root.innerHTML = '<div class="bar"><b>RUAMKIT</b><select id="days"><option value="1">วันนี้</option><option value="7" selected>7 วัน</option>' +
    '<option value="30">30 วัน</option><option value="90">90 วัน</option></select></div><main class="wide"><div id="body" class="muted">กำลังโหลด...</div></main>';
  var sel = document.getElementById('days');
  function load() {
    run('getDashboardData', PIN, sel.value).then(function (d) {
      var max = Math.max.apply(null, d.byHour.concat([1]));
      var bars = d.byHour.map(function (v, h) { return '<i title="' + h + ':00 = ' + v + ' คิว" style="height:' + Math.round(v / max * 100) + '%"></i>'; }).join('');
      var tmax = Math.max.apply(null, d.trend.values.concat([1]));
      var tr = d.trend.values.map(function (v, i) { return '<i title="' + d.trend.labels[i] + ' = ' + v + ' คิว" style="height:' + Math.round(v / tmax * 100) + '%"></i>'; }).join('');
      var na = function (v, u) { return v === null ? '-' : v + u; };
      document.getElementById('body').innerHTML =
        '<div class="kpis"><div class="kpi"><span class="muted">คิวทั้งหมด</span><b>' + d.total + '</b></div>' +
        '<div class="kpi"><span class="muted">ให้บริการแล้ว</span><b>' + d.served + '</b></div>' +
        '<div class="kpi"><span class="muted">ยกเลิก/ไม่มา</span><b>' + d.cancelled + '</b></div>' +
        '<div class="kpi"><span class="muted">รอเฉลี่ย (นาที)</span><b>' + na(d.avgWait, '') + '</b></div>' +
        '<div class="kpi"><span class="muted">บริการเฉลี่ย (นาที)</span><b>' + na(d.avgService, '') + '</b></div>' +
        '<div class="kpi"><span class="muted">ช่วงคนเยอะสุด</span><b>' + (d.peakHour === null ? '-' : d.peakHour + ':00') + '</b></div></div>' +
        '<div class="card" style="text-align:left"><b>จำนวนคิวตามชั่วโมง</b><div class="hours">' + bars + '</div><div class="hl"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div></div>' +
        '<div class="card" style="text-align:left"><b>จำนวนคิวรายวัน</b><div class="hours">' + tr + '</div><div class="hl"><span>' + d.trend.labels[0] + '</span><span>' + d.trend.labels[d.trend.labels.length - 1] + '</span></div></div>';
    }).catch(function (e) { document.getElementById('body').textContent = msg(e); });
  }
  sel.onchange = load; load();
}

/* ---------- เริ่มทำงาน ---------- */
try {
  if (ROLE === 'caller') start('เจ้าหน้าที่', caller);
  else if (ROLE === 'display') display();
  else if (ROLE === 'dashboard') start('แดชบอร์ด', dashboard);
  else menu();
} catch (e) {
  root.innerHTML = '<main><div class="card">เกิดข้อผิดพลาด: ' + msg(e) + '</div></main>';
}
</script>
</body>
</html>
